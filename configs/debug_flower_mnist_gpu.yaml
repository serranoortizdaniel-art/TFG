# Validacion rapida de Flower con clientes en GPU.
# Pensada para RTX 3050/3050 Ti de 4 GB: un solo actor Ray usa la GPU.
experiment_name: debug_flower_mnist_gpu
dataset: mnist
num_clients: 4
num_rounds: 2
local_epochs: 1
partition_type: iid
attack_type: none
malicious_fraction: 0.0
aggregator: fedavg
seed: 42
device: cuda
flower:
  client_device: cuda
  num_cpus: 4.0
  num_gpus: 1.0
  ray_init_args:
    include_dashboard: false
    num_cpus: 4
