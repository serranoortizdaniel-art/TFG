# Validacion corta de Flower (WSL): MNIST, 4 clientes, 2 rondas.
experiment_name: debug_flower_mnist
dataset: mnist
num_clients: 4
num_rounds: 2
local_epochs: 1
batch_size: 64
partition_type: iid
attack_type: none
malicious_fraction: 0.0
aggregator: fedavg
seed: 42
device: cpu
flower:
  client_device: cpu
  num_cpus: 2.0
  num_gpus: 0.0
  ray_init_args:
    include_dashboard: false
    num_cpus: 4
